{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                    <h2 class="fw-bold mb-2">Create an Account</h2>
                    <p class="text-muted">Register to add and manage profiles.</p>
                </div>

                <form method="POST" action="{{ url_for('signup') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-600">Username</label>
                        <input type="text" class="form-control form-control-lg bg-light border-0" id="username"
                            name="username" placeholder="Choose a username" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-600">Email Address</label>
                        <input type="email" class="form-control form-control-lg bg-light border-0" id="email"
                            name="email" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-600">Password</label>
                        <input type="password" class="form-control form-control-lg bg-light border-0" id="password"
                            name="password" placeholder="Create a password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg d-block w-100 mb-3 shadow-sm">
                        Create Account
                    </button>

                    <div class="text-center mt-4">
                        <span class="text-muted">Already have an account?</span>
                        <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold">Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

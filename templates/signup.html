{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <!-- Increased from col-md-5 col-lg-4 to col-md-8 col-lg-6 for a larger box -->
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-2xl border-0">
            <div class="card-body p-5">
                <div class="text-center mb-5">
                    <!-- Removed user icon as requested -->
                    <h1 class="fw-black mb-2" style="font-size: 2.5rem !important;">Create Account</h1>
                    <p class="fw-bold fs-5" style="color: #ffffff !important;">Join the global elite coding community.
                    </p>
                </div>

                <form method="POST" action="{{ url_for('signup') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label" style="font-size: 1.1rem !important;">Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="coder_pro"
                            required autocomplete="username">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label" style="font-size: 1.1rem !important;">Email
                            Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="pro@domain.com"
                            required autocomplete="email">
                    </div>

                    <div class="mb-5">
                        <label for="password" class="form-label" style="font-size: 1.1rem !important;">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••"
                            required autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-4 py-3">
                        Start Your Journey
                    </button>
                </form>

                <div class="text-center pt-4 border-top" style="border-color: rgba(255,255,255,0.2) !important;">
                    <p class="fw-bold fs-5 mb-0">Already a member? <a href="{{ url_for('login') }}"
                            class="fw-black text-decoration-underline"
                            style="color: var(--accent-primary) !important;">Sign In Now</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

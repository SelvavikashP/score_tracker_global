{% extends "layout.html" %}

{% block title %}Reset Password — Global Score Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4" style="min-height: 75vh;">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5" style="max-width: 500px;">
        <div class="glass-card p-4 p-md-5">
            <!-- Header -->
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.4rem; background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);">
                    <i class="fas fa-lock-open"></i>
                </div>
                <span class="badge bg-success-subtle text-success fw-bold px-3 py-1 rounded-pill mb-2" style="background: rgba(16, 185, 129, 0.15); color: #34d399;">Authorized Reset</span>
                <h2 class="fw-bold mb-1">Choose New Password</h2>
                <p class="text-secondary small mb-0">Enter a secure new password for account <strong class="text-white">{{ user.email }}</strong>.</p>
            </div>

            <!-- Form -->
            <form method="POST" action="{{ url_for('reset_password', token=token) }}">
                <div class="mb-3">
                    <label for="new_password" class="form-label">New Password</label>
                    <div class="position-relative">
                        <input type="password" class="form-control pe-5" id="new_password" name="new_password" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password" autofocus>
                        <button type="button" class="btn position-absolute end-0 top-50 translate-middle-y password-toggle-btn me-2" onclick="togglePasswordVisibility('new_password', this)" tabindex="-1" title="Show / Hide Password" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label">Confirm New Password</label>
                    <div class="position-relative">
                        <input type="password" class="form-control pe-5" id="confirm_password" name="confirm_password" placeholder="Repeat new password" minlength="6" required autocomplete="new-password">
                        <button type="button" class="btn position-absolute end-0 top-50 translate-middle-y password-toggle-btn me-2" onclick="togglePasswordVisibility('confirm_password', this)" tabindex="-1" title="Show / Hide Password" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 py-3 mb-3" style="background: linear-gradient(135deg, #10b981, #059669); border: none;">
                    <i class="fas fa-check-circle me-2"></i>Reset and Update Password
                </button>
            </form>

            <div class="text-center pt-3 mt-2 border-top" style="border-color: var(--border-subtle) !important;">
                <a href="{{ url_for('login') }}" class="text-secondary text-decoration-none small">
                    <i class="fas fa-arrow-left me-1"></i>Back to Sign In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

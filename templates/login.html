{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-2xl border-0">
            <div class="card-body p-5">
                <div class="text-center mb-5">
                    <div class="d-inline-flex align-items-center justify-content-center mb-4"
                        style="width: 64px; height: 64px; background: rgba(139, 92, 246, 0.1); border-radius: 16px;">
                        <i class="fas fa-lock-open fa-2x" style="color: var(--accent-primary);"></i>
                    </div>
                    <h2 class="fw-bold mb-2">Welcome</h2>
                    <p class="text-muted">Sign in to sync your global performance.</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-4">
                        <label for="email" class="form-label small text-uppercase fw-bold"
                            style="letter-spacing: 1px; color: var(--accent-secondary);">Email Address</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email"
                            placeholder="name@example.com"
                            style="background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: #fff; border-radius: 12px; font-size: 1rem;"
                            required>
                    </div>

                    <div class="mb-5">
                        <label for="password" class="form-label small text-uppercase fw-bold"
                            style="letter-spacing: 1px; color: var(--accent-secondary);">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password"
                            placeholder="••••••••"
                            style="background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: #fff; border-radius: 12px; font-size: 1rem;"
                            required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-4">
                        Continue
                    </button>
                </form>

                <div class="text-center pt-3 border-top" style="border-color: rgba(255,255,255,0.05) !important;">
                    <p class="text-muted mb-0">No account yet? <a href="{{ url_for('signup') }}"
                            class="fw-bold text-decoration-none" style="color: var(--accent-secondary);">Join the
                            Leaderboard</a></p>
                </div>
            </div>
        </div>
        <div class="text-center mt-4">
            <a href="{{ url_for('index') }}" class="text-decoration-none text-muted small hover-main"
                onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">
                <i class="fas fa-arrow-left me-2"></i>Return to Leaderboard
            </a>
        </div>
    </div>
</div>
{% endblock %}

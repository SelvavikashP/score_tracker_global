{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <!-- Increased from col-md-5 col-lg-4 to col-md-8 col-lg-6 for a larger box -->
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-2xl border-0">
            <div class="card-body p-5">
                <div class="text-center mb-5">
                    <!-- Removed lock icon as requested -->
                    <h1 class="fw-black mb-2" style="font-size: 2.5rem !important;">Welcome</h1>
                    <p class="fw-bold fs-5" style="color: #ffffff !important;">Sign in to sync your global performance.
                    </p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-4">
                        <label for="email" class="form-label" style="font-size: 1.1rem !important;">Email
                            Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com"
                            required>
                    </div>

                    <div class="mb-5">
                        <label for="password" class="form-label" style="font-size: 1.1rem !important;">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••"
                            required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-4 py-3">
                        Continue to Tracker
                    </button>
                </form>

                <div class="text-center pt-4 border-top" style="border-color: rgba(255,255,255,0.2) !important;">
                    <p class="fw-bold fs-5 mb-0">No account yet? <a href="{{ url_for('signup') }}"
                            class="fw-black text-decoration-underline"
                            style="color: var(--accent-secondary) !important;">Join the
                            Leaderboard</a></p>
                </div>
            </div>
        </div>
        <div class="text-center mt-4">
            <a href="{{ url_for('index') }}" class="text-decoration-none text-muted small hover-main"
                onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">
                <i class="fas fa-arrow-left me-2"></i>Return to Leaderboard
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 text-center">
            <div class="card-body p-5">
                <i class="fas fa-lock fa-3x text-primary mb-3"></i>
                <h2 class="fw-bold mb-4">Welcome Back</h2>
                <p class="text-muted mb-4">Sign in to manage the global tracker profiles.
                </p>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3 text-start">
                        <label for="email" class="form-label fw-600">Email Address</label>
                        <input type="email" class="form-control form-control-lg bg-light border-0" id="email"
                            name="email" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-4 text-start">
                        <label for="password" class="form-label fw-600">Password</label>
                        <input type="password" class="form-control form-control-lg bg-light border-0" id="password"
                            name="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg d-block w-100 mb-4 shadow-sm">
                        Sign In
                    </button>
                </form>

                <div class="text-center mt-3 border-top pt-4">
                    <span class="text-muted">Don't have an account?</span>
                    <a href="{{ url_for('signup') }}" class="text-decoration-none fw-bold">Sign Up</a>
                </div>

                <div class="text-center mt-3">
                    <a href="{{ url_for('index') }}" class="text-decoration-none text-muted small">Return to
                        Leaderboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

services:
  - type: web
    name: score-tracker-global
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers=2 --bind=0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: score_tracker
      - key: APP_BASE_URL
        value: https://score-tracker-z8a8.onrender.com
      - key: DEFAULT_STUDENT_PASSWORD
        value: Student@123
      - key: ENABLE_DEMO_DATA
        value: "false"
      - key: INITIAL_ADMIN_EMAIL
        value: admin@scoretracker.io
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_FULLNAME
        value: System Administrator
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
